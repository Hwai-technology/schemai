changelog:
  exclude:
    labels:
      - dependencies
      - dependabot
      - chore
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: "🚀 Features & Enhancements"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "👥 Core Team Contributors"
      labels:
        - team
        - core
