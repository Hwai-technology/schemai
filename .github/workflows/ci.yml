name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run linter
        run: npm run lint

      - name: 🛠️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Run unit tests
        run: npm test

      - name: 📦 Validate VSIX packaging
        run: npx vsce package --allow-missing-repository
