name: SchemAI Automated Release & Marketplace Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish SchemAI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Execute Unit Tests
        run: npm test

      - name: 📦 Package Extension VSIX
        run: npx vsce package --allow-missing-repository

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 🌐 Publish to Visual Studio Marketplace
        if: ${{ env.VS_MARKETPLACE_PAT != '' }}
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: npx vsce publish -p ${{ secrets.VS_MARKETPLACE_PAT }}

      - name: 🌐 Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
