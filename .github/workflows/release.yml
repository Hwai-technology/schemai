name: SchemAI Automated Release & Marketplace Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish SchemAI
    runs-on: ubuntu-latest
    env:
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Run Linter
        run: npm run lint

      - name: 🛠️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Execute Unit Tests
        run: npm test

      - name: 🏷️ Auto-Increment Marketplace Version & Determine Release
        id: version_info
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");

            https.get("https://open-vsx.org/api/schemai-team/schema-ai", (res) => {
              let data = "";
              res.on("data", c => data += c);
              res.on("end", () => {
                let ovsxVersions = ["3.0.0"];
                try {
                  const json = JSON.parse(data);
                  ovsxVersions = Object.keys(json.allVersions || {}).filter(v => v !== "latest");
                } catch (e) {}

                const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                let maxMajor = 3, maxMinor = 0, maxPatch = 0;

                const all = [...ovsxVersions, pkg.version];
                for (const v of all) {
                  const [maj, min, pat] = v.split(".").map(Number);
                  if (maj > maxMajor || (maj === maxMajor && min > maxMinor) || (maj === maxMajor && min === maxMinor && pat > maxPatch)) {
                    maxMajor = maj; maxMinor = min; maxPatch = pat;
                  }
                }

                const nextVersion = `${maxMajor}.${maxMinor}.${maxPatch + 1}`;
                pkg.version = nextVersion;
                fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
                console.log(`Auto-incremented marketplace extension version: ${nextVersion}`);

                fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v0.1.0\n`);
              });
            }).on("error", () => {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const [maj, min, pat] = pkg.version.split(".").map(Number);
              const nextVersion = `${maj}.${min}.${pat + 1}`;
              pkg.version = nextVersion;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v0.1.0\n`);
            });
          '

      - name: 📦 Package Extension VSIX
        run: npx vsce package --allow-missing-repository

      - name: 📝 Prepare Release Notes & Contributors
        id: release_notes
        run: |
          cat << 'EOF' > release_body.md
          ## 📦 SchemAI Extension Release

          ### 👥 Team Contributors (SchemAI Core Team)
          - **Ahmet Asaad Hammoud** ([@Eng-Ahmet](https://github.com/Eng-Ahmet)) — Coordinator, Module Contracts & Analysis Pipeline
          - **Abdul-rhman Hammoud** ([@Abdul-rhman-hammoud](https://github.com/Abdul-rhman-hammoud)) — Alerts, Editor Diagnostics & Decorators
          - **Alexander** — GitHub Code Search & Similarity Calculator
          - **David** — SPDX License Detector, Compatibility Matrix & Risk Engine
          - **Leon** — Configuration, Workspace License Detection & Policies
          - **Sergio** — AI / LLM Explainer & QuickFix Provider
          - **Yunus Emre Köroğlu** ([@yunusemrekoroglu](https://github.com/yunusemrekoroglu)) — Network Resilience, HTTP Client & Rate Limiting
          - **Yusuf** — GitHub Authentication, Secret Storage & Audit History

          ---

          EOF

          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md >> release_body.md
          fi

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: "SchemAI v0.1.0 — Release (Sprint 1)"
          files: '*.vsix'
          body_path: release_body.md
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: 🌐 Publish to Visual Studio Marketplace
        if: env.VS_MARKETPLACE_PAT != ''
        run: |
          echo "Publishing to Visual Studio Marketplace..."
          npx vsce publish -p ${{ env.VS_MARKETPLACE_PAT }} || echo "⚠️ VS Marketplace: upload skipped or version already published."

      - name: 🌐 Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          echo "Publishing to Open VSX Registry..."
          npx ovsx publish *.vsix -p ${{ env.OVSX_PAT }} || echo "⚠️ Open VSX: upload skipped or version already published."

      - name: 💾 Commit Auto-Incremented Version to Git
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): auto-bump extension version to ${{ steps.version_info.outputs.version }} [skip ci]" || true
          git push origin main || true
