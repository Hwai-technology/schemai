name: SchemAI Automated Release & Marketplace Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish SchemAI
    runs-on: ubuntu-latest
    env:
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Run Linter
        run: npm run lint

      - name: 🛠️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Execute Unit Tests
        run: npm test

      - name: 🏷️ Determine Release Version
        id: version_info
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Extension Package Version: $PKG_VERSION"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$PKG_VERSION" >> $GITHUB_OUTPUT
          fi
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 📦 Package Extension VSIX
        run: npx vsce package --allow-missing-repository

      - name: 📝 Prepare Release Notes & Contributors
        id: release_notes
        run: |
          cat << 'EOF' > release_body.md
          ## 📦 SchemAI Extension Release

          ### 👥 Team Contributors (SchemAI Core Team)
          - **Ahmet Asaad Hammoud** ([@Eng-Ahmet](https://github.com/Eng-Ahmet)) — Coordinator, Module Contracts & Analysis Pipeline
          - **Abdul-rhman Hammoud** ([@Abdul-rhman-hammoud](https://github.com/Abdul-rhman-hammoud)) — Alerts, Editor Diagnostics & Decorators
          - **Alexander** — GitHub Code Search & Similarity Calculator
          - **David** — SPDX License Detector, Compatibility Matrix & Risk Engine
          - **Leon** — Configuration, Workspace License Detection & Policies
          - **Sergio** — AI / LLM Explainer & QuickFix Provider
          - **Yunus Emre Köroğlu** ([@yunusemrekoroglu](https://github.com/yunusemrekoroglu)) — Network Resilience, HTTP Client & Rate Limiting
          - **Yusuf** — GitHub Authentication, Secret Storage & Audit History

          ---

          EOF

          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md >> release_body.md
          fi

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          files: '*.vsix'
          body_path: release_body.md
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: 🌐 Publish to Visual Studio Marketplace
        if: env.VS_MARKETPLACE_PAT != ''
        run: |
          echo "Publishing to Visual Studio Marketplace..."
          npx vsce publish -p ${{ env.VS_MARKETPLACE_PAT }} || echo "⚠️ VS Marketplace: upload skipped or version already published."

      - name: 🌐 Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          echo "Publishing to Open VSX Registry..."
          npx ovsx publish *.vsix -p ${{ env.OVSX_PAT }} || echo "⚠️ Open VSX: upload skipped or version already published."
