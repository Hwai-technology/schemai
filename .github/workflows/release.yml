name: SchemAI Automated Release & Marketplace Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish SchemAI
    runs-on: ubuntu-latest
    env:
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Execute Unit Tests
        run: npm test

      - name: 🏷️ Sync Version with Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing package.json to Git Tag: $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

      - name: 📦 Package Extension VSIX
        run: npx vsce package --allow-missing-repository

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 🌐 Publish to Visual Studio Marketplace
        if: env.VS_MARKETPLACE_PAT != ''
        run: |
          echo "Publishing to Visual Studio Marketplace..."
          npx vsce publish -p ${{ env.VS_MARKETPLACE_PAT }} || echo "⚠️ VS Marketplace: upload skipped or version already published."

      - name: 🌐 Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          echo "Publishing to Open VSX Registry..."
          npx ovsx publish *.vsix -p ${{ env.OVSX_PAT }} || echo "⚠️ Open VSX: upload skipped or version already published."
